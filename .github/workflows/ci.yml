---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: true

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Packed package integrations
        run: pnpm run test:package

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Dry Run Publish on NPM
        if: false # "github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')"
        run: pnpm publish --provenance --access public --dry-run --no-git-checks

      - name: Publish on NPM
        if: "startsWith(github.ref, 'refs/tags/')"
        run: pnpm stage publish --provenance --access public --no-git-checks

  react18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: true

      - name: Install React 18 compatibility baseline
        run: pnpm add --save-dev react@18.3.1 react-dom@18.3.1

      - name: Tests with React 18
        run: pnpm test
